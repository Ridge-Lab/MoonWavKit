name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit Version
        run: moon version --all

      - name: Format
        run: moon fmt --check

      - name: Check All Targets
        run: moon check --target all --deny-warn

      - name: Build All Targets
        run: moon build --target all

      - name: Test All Targets
        run: moon test --target all --deny-warn

      - name: Coverage Summary
        run: |
          moon test --enable-coverage
          moon coverage report -f summary

      - name: Verify Public Interfaces
        run: |
          moon info --target all
          git diff --exit-code -- '*.mbti'

      - name: Verify CLI reports and the public API example
        shell: bash
        run: |
          set -euo pipefail
          for backend in wasm wasm-gc js native; do
            moon run cmd/main --target "$backend" | tee "$RUNNER_TEMP/cli-text.txt"
            grep -Fx 'status: PASS' "$RUNNER_TEMP/cli-text.txt"
            moon run cmd/main --target "$backend" -- --json | jq -e '
              .ok == true and .encoding == "pcm" and .channels == 1 and
              .sample_rate == 8000 and .bits_per_sample == 16 and .frames == 4'
            moon run examples/basic --target "$backend" | tee "$RUNNER_TEMP/basic.txt"
            grep -Fx 'frames=4' "$RUNNER_TEMP/basic.txt"
            grep -Fx 'fixture_catalog_passed=true' "$RUNNER_TEMP/basic.txt"
          done

      - name: Compare real file output with Python wave and struct
        run: |
          python3 tools/verify_wav.py --target wasm
          python3 tools/verify_wav.py --target native

      - name: Run Float32 decoder benchmark
        run: moon bench --target js -p Ridge-Lab/moonwavkit -f decoder_bench_wbtest.mbt
