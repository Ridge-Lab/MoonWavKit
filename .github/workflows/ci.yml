name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit Version
        run: moon version --all

      - name: Format
        run: moon fmt --check

      - name: Check All Targets
        run: moon check --target all --deny-warn

      - name: Build All Targets
        run: moon build --target all

      - name: Test All Targets
        run: moon test --target all --deny-warn

      - name: Coverage Summary
        run: |
          moon test --enable-coverage
          moon coverage report -f summary

      - name: Verify Public Interfaces
        run: |
          moon info --target all
          git diff --exit-code -- '*.mbti'

      - name: Run CLI Text
        run: moon run cmd/main

      - name: Run CLI JSON
        run: moon run cmd/main -- --json

      - name: Run Basic Example
        run: moon run examples/basic
